        - "I think that continuing to add 10 harvest spiders will not help improve corn harvest in year 6 because when they added the spiders before, the number of final eggs continued to increase while the number of corn harvested decreased. When you look at the table, you see that they started adding harvest spiders in year 3, however the amount of rootworm eggs in the end continues to increase. It increases from 53-89. Also, when you look at the number of corn harvested, the value continues to decrease. This means that adding harvest spiders does not have too large of an impact that saves the crops from the rootworms. Also, when you look at the graph, when harvest spiders start being introduced, the amount of initial rootworm eggs is still increasing, aswell as the amount of final rootworm eggs, while the amount of corn harvested continues to decrease. This means that the introduction of harvest spiders is not stopping the rootworms from affecting the corn harvest. In conclusion, this means that the harvest spiders will not help improve corn harvest in year 6."
      cause_effect:
