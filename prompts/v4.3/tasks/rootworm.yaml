        - "I think that the farm should add more spiders in year six such as 13-15 spiders. I think this becaus the rootworm population trend seen to be going up.  Becaus ethe population is going up we need to add more spiders to kill of the rootworms at the farm. When the farm first introduced spiders to the land the startintg rootworm eggs was 29. At the end of the year it was 89. In year 4 they started with 41 and ended with 89. In year 5 they started with 41 and ended with 100 eggs. See how the population keeps going up? That is why we need more spiders."
        - "Adding 10 harvest spiders will not improve the corn harvest in Year 6. This is because the amount of corn harvested each year is going down even when there are ten harvest spiders. Furthermore, the graph shows how the number of corn harvested is decreasing every year while the number of rootworm eggs is increasing every year and the amount of harvest spiders stays the same. This shows how the harvest spiders don't improve the corn harvest because the amount of rootworms is increasing even with the harvest spiders in the corn crop. Additionally, the number of spiders only being ten would most likely be the reason why it isn't affecting the number of rootworms as much because there are 130 corn and more than double the amount of rootworms than harvest spiders so only having ten would not be very effective."

