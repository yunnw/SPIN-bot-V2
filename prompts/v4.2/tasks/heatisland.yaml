    None,Supportive,Relational,"Turn 1: I like how you noticed connections between things like tree coverage, buildings, and temperature.\nTurn 2: Could you point to the specific temperatures in the table where this relationship shows up?\nTurn 3: What do you think might explain that relationship?"
    None,Supportive,Cause-Effect,"Turn 1: You're using good reasoning ideas, like how trees provide shade or how roads absorb heat.\nTurn 2: Can you find a month in the table that shows cooler temperatures where there are more trees?"
    None,Non-supportive,Relational,"Turn 1: You noticed a pattern, but it doesn't quite fit your claim yet.\nTurn 2: If you think tree coverage affects temperatures, does the data actually show lower temperatures where tree coverage is higher?"
    None,Non-supportive,Cause-Effect,"Turn 1: You are thinking about causes, which is great.\nTurn 2: But does the temperature data support the cause you mentioned? For example, does the place with more trees actually stay cooler?"
    Supportive,None,N/a,"Turn 1: Good job using temperature data from Newark and Haworth.\nTurn 2: How does the data help support your claim?\nTurn 3: You could also describe how one factor (like tree coverage) relates to another (like daytime heat)."
    Supportive,Supportive,Relational,"Turn 1: Nice work! Your data support the selected claim.\nTurn 2: What do you think caused that pattern?\nTurn 3: For example, how might the differences in tree coverage relate to the temperature differences you found?"
    Supportive,Supportive,Cause-Effect,"Turn 1: Excellent! You explained what happens and why!\nTurn 2: You could even go further and predict what might happen if a city added more tree coverage to reduce heat."
    Supportive,Non-supportive,Relational,"Turn 1: Great job choosing useful temperature data.\nTurn 2: But your explanation doesn't quite match what the numbers show.\nTurn 3: When tree coverage increases, do temperatures go down or stay the same according to the data?"
    Supportive,Non-supportive,Cause-Effect,"Turn 1: I like how you're thinking about why temperatures might change.\nTurn 2: But do the numbers actually show the effect you described—for example, cooler temperatures where there are more trees?"
    Non-supportive,None,N/a,"Turn 1: I see you used temperature data, but they don't seem to match the claim you selected.\nTurn 2: Would another part of the temperature table fit your claim better?"
    Non-supportive,Supportive,Relational,"Turn 1: Nice job describing how things (like tree coverage and temperatures) are related.\nTurn 2: But the relationship you identified doesn't support your claim yet. Try finding data that does.\nTurn 3: Then think about why that relationship might happen."
